app:
  info:
    application_name: ${PROJECT_NAME:app service}
    version: ${PROJECT_VERSION:1.0.0}
    description: ${PROJECT_DESCRIPTION:Payment Receipt Service}
    artifact_Id: ${PROJECT_ARTIFACTID:payment-receipt-service}
    group_Id: ${PROJECT_GROUPID:ru.sogaz.site}
    app_profile: ${ENVIRONMENT:local}
    java-version: ${JAVA_VERSION:21}

server:
  port: ${SERVER_PORT:8080}
  use-forward-headers: true
  forward-headers-strategy: framework
  main.allow-bean-definition-overriding: true

spring:
  application:
    name: payment-receipt-service
  profiles:
    active: ${ENVIRONMENT:local}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/receipt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  liquibase:
    change-log: db.changelog/db.changelog-master.yaml
  output:
    ansi:
      enabled: ALWAYS
  cache:
    type: caffeine
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

resilience4j:
  retry:
    instances:
      rabbitConsumerRetry:
        maxAttempts: ${RABBIT_CONSUMER_RETRY_MAX_ATTEMPTS:4}
        waitDuration: ${RABBIT_CONSUMER_RETRY_INITIAL_WAIT_DURATIONS:10s}
        enableExponentialBackoff: ${RABBIT_CONSUMER_RETRY_EXPONENTIAL:true}
        exponentialBackoffMultiplier: ${RABBIT_CONSUMER_RETRY_WAIT_MULTIPLAYER:5}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${HOSTNAME:localhost}
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_SERVICE_PORT:8093}
  health:
    livenessState:
      enable: true
    readinessState:
      enable: true

logging:
  level:
    ru:
      sogaz:
        site:
          pattern: ${LOGGING_LEVEL_RU_SOGAZ_ESB:DEBUG}
  proxy:
    frontend-enabled: ${LOGGING_PROXY_FRONTEND_ENABLED:true}
    upstream-enabled: ${LOGGING_PROXY_UPSTREAM_ENABLED:true}
    max-body-bytes: ${LOGGING_PROXY_MAX_BODY_BYTES:6000}
    log-headers: ${LOGGING_PROXY_LOG_HEADERS:false}
    stacktrace-enabled: ${LOGGING_PROXY_STACKTRACE_ENABLE:false}
    sensitive-fields: ${LOGGING_SENSITIVE_FIELDS}

  rabbit:
    enabled: ${LOGGING_RABBIT_ENABLED:true}
    log-body: ${LOGGING_RABBIT_LOG_BODY:true}
    confirms-enabled: ${LOGGING_RABBIT_CONFIRMS_ENABLED:false}
    returns-enabled: ${LOGGING_RABBIT_RETURNS_ENABLED:false}

logstash:
  host: ${LOG_SERVER_HOST:log.sogaz.ru}
  port: ${LOG_SERVER_PORT:12201}
  level: ${LOG_LEVEL:INFO}
  level_test: ${LOG_LEVEL_TEST:INFO}

config:
  atol:
    api:
      basePath: ${ATOL_URL:https://testonline.atol.ru/possystem}
      tokenTTL: ${TOKEN_TIME:720}
    company:
      email: ${COMPANY_EMAIL:Diop.Sheykh@sogaz.ru}
      inn: ${COMPANY_INN:5544332219}
      paymentAddress: ${PAYMENT_ADDRESS:https://your-payment.url}
      depersonalizedPaymentAddress: ${DEPERSONALIZED_PAYMENT_ADDRESS:http://health-and-care.ru}
    callback:
      url: ${CALLBACK_URL:http://localhost:8080/paymentcheck/status}
  rabbit:
    receiptExchange: ${RECEIPT_EXCHANGE:receipt.exchange}
    receiptRequestedRoutingKey: ${RECEIPT_REQUESTED_ROUTING_KEY:receipt.requested}
    receiptRequestedQueue: ${RECEIPT_REQUESTED_QUEUE:receipt.requested.queue}
    receiptRequestedQueueDlq: ${RECEIPT_REQUESTED_QUEUE_DLQ:receipt.requested.queue.dlq}
    receiptRequestedRoutingKeyDlq: ${RECEIPT_REQUESTED_QUEUE_DLQ_ROUTING_KEY:receipt.requested.dlq}
    receiptCreatedRoutingKey: ${RECEIPT_CREATED_ROUTING_KEY:receipt.created}
    receiptCreatedQueue: ${RECEIPT_CREATED_QUEUE:receipt.created.queue}
    receiptSentRoutingKey: ${RECEIPT_SENT_ROUTING_KEY:receipt.sent}
    receiptSentQueue: ${RECEIPT_SENT_QUEUE:receipt.sent.queue}
    concurrency:
      consumers: ${RABBIT_CONCURRENCY_CONSUMERS:2}
      maxConsumers: ${RABBIT_CONCURRENCY_MAX_CONSUMERS:5}
      stopConsumerMinIntervalMs: ${RABBIT_CONCURRENCY_STOP_CONSUMERS_MIN_INTERVALS_MS:10000}
  feign:
    retryer:
      maxRetries: ${ATOL_CLIENT_MAX_RETRIES:1}
      minTimeoutMs: ${ATOL_CLIENT_MIN_TIMEOUT_MS:250}
      maxTimeoutMs: ${ATOL_CLIENT_MAX_TIMEOUT_MS:3000}

scheduled:
  task:
    cron: ${CHECK_STATUS_CRON:0 * * * * *}
taxcom:
  api:
    base-url: ${TAXCOM_API_BASE_URL:https://api-lk-ofd.taxcom.ru}
    integrator-id: ${TAXCOM_INTEGRATOR_ID:}
    login: ${TAXCOM_LOGIN:}
    password: ${TAXCOM_PASSWORD:}
  datasource:
    url: ${TAXCOM_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=taxcom;encrypt=false}
    username: ${TAXCOM_DB_USERNAME:sa}
    password: ${TAXCOM_DB_PASSWORD:}
    driver-class-name: ${TAXCOM_DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
  export:
    enabled: ${TAXCOM_EXPORT_ENABLED:false}
    begin: ${TAXCOM_EXPORT_BEGIN:2020-01-01T00:00:00}
    batch-size: ${TAXCOM_EXPORT_BATCH_SIZE:500}
