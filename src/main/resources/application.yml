app:
  info:
    application_name: ${PROJECT_NAME:app service}
    version: ${PROJECT_VERSION:1.0.0}
    description: ${PROJECT_DESCRIPTION:Payment Receipt Service}
    artifact_Id: ${PROJECT_ARTIFACTID:payment-receipt-service}
    group_Id: ${PROJECT_GROUPID:ru.sogaz.site}
    app_profile: ${ENVIRONMENT:dev}
    java-version: ${JAVA_VERSION:21}

server:
  port: ${SERVER_PORT:8080}
  use-forward-headers: true
  main.allow-bean-definition-overriding: true

spring:
  application:
    name: payment-receipt-service
  profiles:
    active: ${ENVIRONMENT:dev}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/receipt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  liquibase:
    change-log: db.changelog/db.changelog-master.yaml
  output:
    ansi:
      enabled: ALWAYS
  cache:
    type: caffeine

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health
  metrics:
    tags:
      application: ${HOSTNAME:localhost}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_SERVER_PORT:8091}
  health:
    livenessState:
      enable: true
    readinessState:
      enable: true

logging:
  level:
    ru:
      sogaz:
        site:
          pattern: ${LOGGING_LEVEL_RU_SOGAZ_ESB:DEBUG}

config:
  atolURL: ${ATOL_URL:https://api.atol.ru}
  AtolLogin: ${ATOL_LOGIN:your-login}
  AtolPass: ${ATOL_PASS:your-password}
  tokenTime: ${TOKEN_TIME:60}
  callbackURL: ${CALLBACK_URL:https://your-callback.url}
  companyEmail: ${COMPANY_EMAIL:noreply@yourcompany.com}
  companyInn: ${COMPANY_INN:1234567890}
  paymentAddress: ${PAYMENT_ADDRESS:https://your-payment.url}
  groupCode: ${GROUP_CODE:your-group-code}
  periodStatusUpdate: ${PERIOD_STATUS_UPDATE:10}

scheduled:
  task:
    defaultDelay: ${CHECK_STATUS_DELAY:60000}